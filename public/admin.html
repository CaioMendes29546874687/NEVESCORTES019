<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel NEVESCORTES019</title><link rel="stylesheet" href="/style.css"></head><body><main class="dashboard"><a class="logo" href="/">N<span>019</span> <b>NEVES<span>CORTES</span></b></a><section id="login" class="login"><h1>Área do profissional</h1><p>Entre para gerenciar sua agenda e faturamento.</p><form id="loginform"><label>Usuário<input id="user" required autocomplete="username"></label><label>Senha<input id="pass" type="password" required autocomplete="current-password"></label><button class="goldbtn">ENTRAR</button><p id="loginmsg"></p></form></section><section id="dash" class="hidden"><h1>Painel de gestão</h1><button class="dashbtn" data-tab="home">Visão geral</button><button class="dashbtn" data-tab="agenda">Agenda</button><button class="dashbtn" data-tab="services">Cadastrar serviço</button><button class="dashbtn" data-tab="expenses">Registrar despesa</button><button class="dashbtn" id="logout">Sair</button><div id="home" class="panel"><h2>Resumo</h2><div id="metrics" class="metricgrid"></div><h2>Próximos agendamentos</h2><div id="next" class="tablewrap"></div></div><div id="agenda" class="panel hidden"><h2>Agenda completa</h2><div id="appointments" class="tablewrap"></div></div><div id="services" class="panel hidden"><h2>Novo serviço</h2><form id="svcform"><label>Nome<input id="sn" required></label><label>Categoria<input id="sc" value="Barbearia" required></label><label>Preço<input id="sp" type="number" min="0" step=".01" required></label><label>Duração (minutos)<input id="sd" type="number" min="5" max="480" value="30" required></label><button class="goldbtn">SALVAR SERVIÇO</button></form></div><div id="expenses" class="panel hidden"><h2>Nova despesa</h2><form id="expform"><label>Descrição<input id="et" required></label><label>Valor<input id="ea" type="number" min="0" step=".01" required></label><label>Data<input id="ed" type="date"></label><button class="goldbtn">REGISTRAR DESPESA</button></form></div><p id="notice"></p></section></main><script src="/admin.js"></script></body></html>
